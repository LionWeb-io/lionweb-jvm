name: CI

on: [push]

# A newer push to the same branch supersedes the running one (main and tags always run to completion).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Let every Java version report its results, instead of cancelling them on the first failure.
      fail-fast: false
      matrix:
        java: [ '17', '25' ]
        include:
          - java: '17'
            integration: true
            javadoc: true
          - java: '25'
            integration: true
    name: Java ${{ matrix.java }} Build and Test

    steps:
    - uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.1
    # `check` includes spotlessCheck and ktlint.
    - name: Test
      run: ./gradlew check --parallel
    # Integration tests reuse the classes compiled above instead of a separate job per module.
    - name: Integration Tests
      if: ${{ !cancelled() && matrix.integration }}
      run: ./gradlew :core:integrationTest :client:integrationTest :server:integrationTest :gradle-plugin:integrationTest --parallel --continue --stacktrace
    - name: Javadoc generation
      if: ${{ !cancelled() && matrix.javadoc }}
      run: ./gradlew myJavadoc
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-java-${{ matrix.java }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7

  functional-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '25' ]
    name: Java ${{ matrix.java }} Functional Tests
    env:
      # Used by AbstractClientFunctionalTest instead of building the server image in every test JVM.
      LIONWEB_SERVER_TEST_IMAGE: lionweb-server-functional-test:ci

    steps:
    - uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.1
    - name: Pre-pull Docker images
      run: docker pull postgres:16.1
    - name: Compute LionWeb server image cache key
      id: server-image
      run: |
        commit=$(grep '^lionwebServerCommitID=' gradle.properties | cut -d= -f2)
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "SERVER_IMAGE_TAR=$RUNNER_TEMP/lionweb-server-image.tar" >> "$GITHUB_ENV"
        echo "key=lionweb-server-image-$commit-${{ hashFiles('client-testing/src/main/resources/**') }}" >> "$GITHUB_OUTPUT"
    - name: Restore LionWeb server image
      id: server-image-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.SERVER_IMAGE_TAR }}
        key: ${{ steps.server-image.outputs.key }}
    - name: Load or build LionWeb server image
      run: |
        if [ -f "$SERVER_IMAGE_TAR" ]; then
          docker load -i "$SERVER_IMAGE_TAR"
        else
          docker build -t "$LIONWEB_SERVER_TEST_IMAGE" \
            --build-arg lionwebServerCommitID=${{ steps.server-image.outputs.commit }} \
            -f client-testing/src/main/resources/clienttesting-lionweb-server-Dockerfile \
            client-testing/src/main/resources
        fi
    # Only one matrix leg saves the image, and only when it was not cached yet.
    - name: Export LionWeb server image
      if: steps.server-image-cache.outputs.cache-hit != 'true' && matrix.java == '17'
      run: docker save -o "$SERVER_IMAGE_TAR" "$LIONWEB_SERVER_TEST_IMAGE"
    - name: Cache LionWeb server image
      if: steps.server-image-cache.outputs.cache-hit != 'true' && matrix.java == '17'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.SERVER_IMAGE_TAR }}
        key: ${{ steps.server-image.outputs.key }}
    - name: Functional Tests
      run: ./gradlew functionalTest --stacktrace --parallel
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: functional-test-results-java-${{ matrix.java }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7
