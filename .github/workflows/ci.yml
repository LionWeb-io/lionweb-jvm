name: CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21', '25' ]
    name: Java ${{ matrix.java }} Build and Test

    steps:
    - uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Check formatting
      run: ./gradlew spotlessCheck
    - name: Test
      run: ./gradlew check --parallel
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-java-${{ matrix.java }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7

  functional-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '25' ]
    name: Java ${{ matrix.java }} Functional Tests

    steps:
    - uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Pre-pull Docker images
      run: docker pull postgres:16.1
    - name: Functional Tests
      run: ./gradlew functionalTest --stacktrace --parallel
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: functional-test-results-java-${{ matrix.java }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7

  core-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '25' ]
    name: Java ${{ matrix.java }} Core Integration Tests

    steps:
    - uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Core Integration Tests
      run: ./gradlew :core:integrationTest --stacktrace --info
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: core-integration-test-results-java-${{ matrix.java }}
        path: '**/build/test-results/**/*.xml'
        retention-days: 7

  client-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '25' ]
    name: Java ${{ matrix.java }} Client Integration Tests

    steps:
      - uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Client Integration Tests
        run: ./gradlew :client:integrationTest --stacktrace --info
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-integration-test-results-java-${{ matrix.java }}
          path: '**/build/test-results/**/*.xml'
          retention-days: 7

  server-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '25' ]
    name: Java ${{ matrix.java }} Server Integration Tests

    steps:
      - uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Server Integration Tests
        run: ./gradlew :server:integrationTest --stacktrace --info
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-integration-test-results-java-${{ matrix.java }}
          path: '**/build/test-results/**/*.xml'
          retention-days: 7

  plugin-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '25' ]
    name: Java ${{ matrix.java }} Plugin Integration Tests

    steps:
    - uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Plugin Integration Tests
      run: ./gradlew :gradle-plugin:integrationTest
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: plugin-integration-test-results-java-${{ matrix.java }}
        path: 'gradle-plugin/build/test-results/integrationTest/**/*.xml'
        retention-days: 7

  javadoc:
    runs-on: ubuntu-latest
    name: Javadoc

    steps:
    - uses: actions/checkout@v7
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Javadoc generation
      run: ./gradlew myJavadoc
