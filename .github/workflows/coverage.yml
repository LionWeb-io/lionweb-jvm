name: Measure code coverage

on:
  pull_request:

# A newer push to the PR supersedes the running measurement.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      # Reuses the dependency and build caches written by CI on main.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Run Coverage
        run: |
          ./gradlew test --parallel

      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/**/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage
          update-comment: true
