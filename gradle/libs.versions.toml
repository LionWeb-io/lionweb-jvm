[versions]
clikt = "5.1.0"
javaWebSocket = "1.6.0"
protobufVersion = "4.35.1"
junitVersion="5.13.4"
guavaVersion = "33.6.0-jre"
commonsMathVersion = "3.6.1"
jsonSchemaValidatorVersion = "3.0.4"
mpsOpenApiVersion = "2021.3.1"
modelApiVersion = "1.3.2"
kotlin ="2.4.10"
kotest ="6.2.2"
testcontainers ="1.21.4"
junitPlatform = "1.13.4"
emfCommonVersion = "2.45.0"
emfEcoreVersion = "2.42.0"
emfEcoreXmiVersion = "2.40.0"
emfjsonVersion = "2.3.0"
annotationsVersion = "26.1.0"
jsr305Version = "3.0.2"
jmhVersion = "1.37"
gradlePublishPluginVersion = "1.2.0"

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.0"}
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
vt-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
build-config = { id = "com.github.gmazzo.buildconfig", version = "6.0.10" }
release = { id = "net.researchgate.release", version = "3.1.0"}
versioncheck = { id="com.github.ben-manes.versions", version = "0.58.0" }
spotless = { id = "com.diffplug.spotless", version = "8.8.0" }
gradle-publish = { id = "com.gradle.plugin-publish", version.ref = "gradlePublishPluginVersion" }

[libraries]
protobuf = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobufVersion" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.4.0" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitVersion" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitVersion" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitVersion" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
guava = { module = "com.google.guava:guava", version.ref = "guavaVersion" }
commonsMath3 = { module = "org.apache.commons:commons-math3", version.ref = "commonsMathVersion" }
jsonSchemaValidator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidatorVersion" }
mpsOpenApi = { module = "com.jetbrains:mps-openapi", version.ref = "mpsOpenApiVersion" }
modelApi = { module = "org.modelix:model-api", version.ref = "modelApiVersion" }
javapoet = { module = "com.palantir.javapoet:javapoet", version ="0.17.0" }
gson = { group = "com.google.code.gson", name="gson", version="2.14.0" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotationsVersion" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305Version" }
emf-common = { module = "org.eclipse.emf:org.eclipse.emf.common", version.ref = "emfCommonVersion" }
emf-ecore = { module = "org.eclipse.emf:org.eclipse.emf.ecore", version.ref = "emfEcoreVersion" }
emf-ecore-xmi = { module = "org.eclipse.emf:org.eclipse.emf.ecore.xmi", version.ref = "emfEcoreXmiVersion" }
emfjson = { module = "org.eclipse.emfcloud:emfjson-jackson", version.ref = "emfjsonVersion" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name="kotlin-reflect", version.ref = "kotlin" }
ktest-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
kotest-runner = { module="io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }
kotest-assertions = { module="io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module="io.kotest:kotest-property", version.ref = "kotest" }
testcontainers =  { module="org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module="org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-pg = { module="org.testcontainers:postgresql", version.ref = "testcontainers" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmhVersion" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmhVersion" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebSocket" }
